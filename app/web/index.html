<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SolutionHub: create, track and discover projects, demos and business solutions.">
  <meta name="theme-color" content="#182C4A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SolutionHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" sizes="16x16 32x32 48x48" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/solutionhub.svg">
  <link rel="manifest" href="manifest.json">
  <title>SolutionHub</title>
  <!-- No inline scripts: the Content-Security-Policy only allows same-origin scripts. -->
  <style>
    html, body { margin: 0; background: #f7f8fa; }
    body:has(flutter-view) #boot { display: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: start center; padding: 72px 24px 24px; }
    #boot > div { width: min(420px, 100%); }
    #boot img { display: block; margin-bottom: 28px; }
    #boot span { display: block; height: 12px; margin-top: 14px; border-radius: 6px; background: #e5eaf1; }
    #boot span:nth-of-type(1) { width: 65%; height: 22px; }
    #boot span:nth-of-type(3) { width: 82%; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #111721; }
      #boot span { background: #253246; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading SolutionHub">
    <div aria-hidden="true">
      <img src="icons/solutionhub.svg" width="40" height="40" alt="">
      <span></span><span></span><span></span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
