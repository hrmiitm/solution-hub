name: Release Android app

# Builds a signed release APK and attaches it to a GitHub Release.
#   git tag v0.1.0 && git push origin v0.1.0
#   or: gh workflow run release-android.yml -f tag=v0.1.0
# The tag must match `version:` in app/pubspec.yaml (v0.1.0 <-> 0.1.0+N).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # SHA-1 of the release key registered with Google Cloud (public identifier).
  # Google sign-in only works in APKs signed with this key.
  EXPECTED_SHA1: '4C:76:25:29:B3:A4:23:3F:FC:74:D3:4C:45:EE:69:AB:7C:69:FA:91'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check tag and configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLIENT_ID: ${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag '$TAG' must look like v0.1.0"; exit 1; }
          pub="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          [[ "v$pub" == "$TAG" ]] || { echo "::error::Tag $TAG does not match app/pubspec.yaml version $pub"; exit 1; }
          missing=""
          for n in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CLIENT_ID APP_URL; do
            [[ -n "${!n}" ]] || missing="$missing $n"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secrets/variables:$missing. See README, Releases."
            exit 1
          fi
          [[ "$APP_URL" == https://* ]] || { echo "::error::APP_URL must be https"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$jks"
          got="$(keytool -list -v -keystore "$jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p')"
          if [[ "$got" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Signing key SHA-1 is $got, expected $EXPECTED_SHA1. An APK signed with another key cannot use Google sign-in."
            exit 1
          fi
          {
            echo "storeFile=$jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ vars.APP_URL }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ vars.GOOGLE_OAUTH_WEB_CLIENT_ID }}"

      - name: Verify APK signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk \
            | tee certs.txt
          want="$(echo "$EXPECTED_SHA1" | tr -d ':' | tr 'A-F' 'a-f')"
          grep -qi "SHA-1 digest: $want" certs.txt || { echo "::error::APK is not signed with the expected key"; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="solutionhub-$TAG.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat > notes.md <<NOTES
          ## Install on Android

          1. Download **$apk** below on your phone.
          2. Open it and allow "Install unknown apps" for your browser or file manager if asked.
          3. Sign in with Google.

          The app talks to ${{ vars.APP_URL }}. Verify the download with \`sha256sum -c $apk.sha256\`.
          Requires Android 7.0 (API 24) or newer.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$TAG" "$apk" "$apk.sha256" \
              --target "$GITHUB_SHA" --title "SolutionHub ${TAG#v}" \
              --generate-notes --notes-file notes.md
          fi
